name: Últimos videos de YouTube

on:
  schedule:
    - cron: "17 */6 * * *" # cada 6 horas
  workflow_dispatch: # permite ejecutarlo a mano desde la pestaña Actions
  push:
    branches: [main]
    paths:
      - ".github/scripts/update_youtube.py"
      - ".github/workflows/youtube.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar README
        env:
          YOUTUBE_HANDLE: luissubiabre
          # Opcional: pega aquí el ID de tu canal (empieza con "UC") si la detección automática falla
          YOUTUBE_CHANNEL_ID: ""
          MAX_VIDEOS: "4"
        run: python .github/scripts/update_youtube.py

      - name: Guardar cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios en el README"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualiza últimos videos de YouTube"
          git push
